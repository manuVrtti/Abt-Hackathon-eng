<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ event }}{% endblock %}</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#5f6368;--line:#e2e2e6;--accent:#1a56db;--bad:#b42318;--warn:#b54708;--ok:#067647;--code:#f5f5f7}
@media (prefers-color-scheme: dark){:root{--bg:#141416;--fg:#ececf0;--muted:#a0a0aa;--line:#2c2c31;--accent:#7aa2ff;--bad:#ff8a80;--warn:#ffb86b;--ok:#6ee7a8;--code:#1e1e22}}
body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:24px 16px}
main{max-width:860px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 .25rem}h2{font-size:1.15rem;margin:2rem 0 .5rem}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:.9rem;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
pre{background:var(--code);padding:10px;border-radius:6px;overflow-x:auto;font-size:.82rem;white-space:pre-wrap;word-break:break-word}
a{color:var(--accent)} .btn{display:inline-block;background:var(--accent);color:var(--bg);padding:8px 14px;border-radius:6px;text-decoration:none;border:0;font:inherit;cursor:pointer}
textarea{width:100%;min-height:160px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;box-sizing:border-box}
</style></head><body><main>{% block body %}{% endblock %}</main></body></html>
