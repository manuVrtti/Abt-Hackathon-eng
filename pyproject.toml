[project]
name = "hackeval"
version = "0.1.0"
description = "Hackathon evaluation engine: freeze, rule gates, automated scoring, hand-off, deep review and judging"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
    "jinja2>=3.1",
    "datasketch>=1.6",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
admin = ["streamlit>=1.35", "pandas>=2.2"]
llm = ["anthropic>=0.40", "openai>=1.40"]
ui = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
hackeval = "hackeval.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hackeval*"]

[tool.setuptools.package-data]
hackeval = ["templates/*", "rubric/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B"]
# B008: typer options in defaults are the library's idiom. B905: zip lengths are equal by construction.
ignore = ["B008", "B905", "B023", "B007"]
